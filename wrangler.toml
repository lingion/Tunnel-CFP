name = "proxy"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "proxy.qdp.qzz.io", custom_domain = true }
]

# KV：面板配置存储
[[kv_namespaces]]
binding = "KV"
id = "314b603009c74d67995937477c8e603a"

[vars]
# UUID 节点认证：部署时生成一次写入（非机密但应稳定）
UUID = "01bae8c6-bd8f-4060-ac9e-4f7cfe561f34"

[observability]
enabled = true
