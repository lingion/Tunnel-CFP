name = "cfp"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# 自定义域名：cfp.qdp.qzz.io（与 proxy.qdp.qzz.io 同家族，绕过 workers.dev 国内被墙）
routes = [
  { pattern = "cfp.qdp.qzz.io", custom_domain = true }
]

# cfp Worker — v3 新部署目标
# 与原 proxy worker 共用 CF account (07401407fe88e9e8ce61d54ea0e385f3)

# KV：v3 独立 KV namespace（与原 worker 的 314b603009c74d67995937477c8e603a 不共享）
# vendor edgetunnel 硬编码 env.KV，所以 binding 必须叫 "KV"
[[kv_namespaces]]
binding = "KV"
id = "e724e1591a33423ea603114a42f65984"

[vars]
# UUID 节点认证：v3 生成新 UUID（与原 worker 不共享，避免节点混淆）
UUID = "b88ab8fa-392c-44b3-9343-612c11814708"

[observability]
enabled = true

# 部署命令:
#   export CLOUDFLARE_API_TOKEN=$(cat ~/.cloudflare-token)
#   cd ~/proxy && npx wrangler deploy -c wrangler.cfp.toml

# Secrets 设置（v3 首次部署后跑）:
#   npx wrangler secret put ADMIN -c wrangler.cfp.toml
#   npx wrangler secret put KEY -c wrangler.cfp.toml  (vendor edgetunnel 用)
#   npx wrangler secret put AGENT_KEY -c wrangler.cfp.toml  (Agent API 用)
